name: Make build

# Temporary, fork-only workflow: does the Nix contract hold on a stock Ubuntu runner?
# Nix is installed with the repository's own `make bootstrap-nix` and the build runs
# inside `nix develop`. No apt packages, no Flutter/Go/Rust setup actions: the flake
# must supply everything.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-prebuilts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Without Nix the build must refuse, with a pointer to bootstrap-nix
        run: |
          out="$(make build-linux VERSION=0.0.0 BUILD_NUM=9999 CONFIRM=1 PREBUILTS=1 2>&1)" && { echo "must refuse without Nix" >&2; exit 1; }
          echo "$out" | grep -q 'make bootstrap-nix' || { echo "no pointer to bootstrap-nix: $out" >&2; exit 1; }
      - name: Bootstrap Nix with the repository's own target
        run: |
          NIX_INSTALL_YES=1 make bootstrap-nix
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
      - name: Requirements, tested inside the Nix shell
        run: |
          nix develop --command make toolchain
          nix develop --command make check-reqs
      - name: Build inside the Nix shell (verified prebuilts)
        run: nix develop --command make build-linux VERSION=0.0.0 BUILD_NUM=9999 CONFIRM=1 PREBUILTS=1
      - name: What did we build? (interpreter and runtime paths)
        run: |
          b=build/linux/x64/release/bundle
          ls -la "$b" | head -20
          echo "--- ELF interpreter of the app binary:"; readelf -l "$b/stack_wallet" | grep -i 'interpreter'
          echo "--- RPATH/RUNPATH:"; readelf -d "$b/stack_wallet" | grep -Ei 'rpath|runpath' || true
          echo "--- shared libraries that resolve into /nix/store:"; ldd "$b/stack_wallet" 2>/dev/null | grep -c '/nix/store' || true

  ubuntu-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Bootstrap Nix with the repository's own target
        run: |
          NIX_INSTALL_YES=1 make bootstrap-nix
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
      - name: Build inside the Nix shell, dnix packages from source (the default)
        run: nix develop --command make build-linux VERSION=0.0.0 BUILD_NUM=9999 CONFIRM=1
